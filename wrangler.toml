name = "dbir-agents"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
# account_id = "YOUR_ACCOUNT_ID_HERE"

# Workers AI — primary: kimi-k2.6, fallback: llama-3.1-8b
[ai]
binding = "AI"

# R2 — raw PDFs + generated artifacts
[[r2_buckets]]
binding = "DBIR_PDFS"
bucket_name = "dbir-pdfs"

# D1 — pipeline runs, artifacts, extraction cache
[[d1_databases]]
binding = "DB"
database_name = "dbir-analysis"
# database_id = "YOUR_DATABASE_ID_HERE"

# Vectorize — semantic search over DBIR chunks
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "dbir-chunks"

# Browser Rendering — PDF→PNG for diagrams (Workers Paid plan required)
# [browser]
# binding = "BROWSER"

# REMOVED Workflow binding - testing without it
# [[workflows]]
# binding = "DbirPipeline"
# name = "dbir-pipeline"
# class_name = "DbirPipeline"

# Environment variables (set via wrangler secrets)
# PRIMARY_MODEL, FALLBACK_MODEL set via: wrangler secret put PRIMARY_MODEL
vars = { MAX_TOKENS = "4096", TEMPERATURE = "0.3", PIPELINE_MODE = "sequential" }
